apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: gitops-demo


  template:

    metadata:
      labels:
        app: gitops-demo


    spec:

      containers:

      - name: gitops-demo

        image: 529088275092.dkr.ecr.us-east-1.amazonaws.com/gitops-demo:1

        ports:
        - containerPort: 3000

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"